name: runova
description: Gamified GPS running and territory control for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  dio: ^5.9.0
  drift: ^2.30.0
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  go_router: ^17.1.0
  maplibre_gl: ^0.27.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  sqflite: ^2.4.2
  sqlite3_flutter_libs: ^0.6.0+eol
  supabase_flutter: ^2.12.0
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.30.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
