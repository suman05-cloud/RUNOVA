name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: runova
          POSTGRES_PASSWORD: runova
          POSTGRES_DB: runova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runova -d runova"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUNOVA_DATABASE_URL: postgresql+asyncpg://runova:runova@localhost:5432/runova
      RUNOVA_DEV_JWT_SECRET: ci-only-runova-test-signing-secret-not-for-deployment
      RUNOVA_DEV_LOGIN_ENABLED: "true"
      RUNOVA_RATE_LIMIT_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check . --no-cache
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
