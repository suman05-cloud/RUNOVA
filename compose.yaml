name: runova

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: runova
      POSTGRES_USER: runova
      POSTGRES_PASSWORD: runova
    ports:
      - "5432:5432"
    volumes:
      - runova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runova -d runova"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - runova_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  runova_postgres_data:
  runova_redis_data:

